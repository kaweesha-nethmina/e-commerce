              --username kaweesha-nethmina \
              --password ${{ secrets.CR_PAT }}
            az containerapp update \
              --name user-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_PREFIX }}/user-service:latest \
              --set-env-vars \
                MONGO_URI="mongodb+srv://kaweesha:17420@myatlasclusteredu.dubkafb.mongodb.net/" \
                PORT="3001" \
                JWT_SECRET="your-jwt-secret" \
                RABBITMQ_URL="amqp://guest:guest@rabbitmq:5672/"
          else
            echo "Creating user-service..."
            az containerapp create \
              --name user-service \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.ACA_ENV }} \
              --image ${{ env.IMAGE_PREFIX }}/user-service:latest \
              --registry-server ghcr.io \
              --registry-username kaweesha-nethmina \
              --registry-password ${{ secrets.CR_PAT }} \
