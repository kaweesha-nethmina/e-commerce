name: CI/CD — Build & Deploy to Azure Container Apps

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   - Push to `main` branch  → builds only the services that changed
#   - Manual trigger (workflow_dispatch) → lets you choose which service to deploy
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (leave empty to deploy all changed)'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
# Permissions:
#   packages: write  → allows GITHUB_TOKEN to push images to GHCR
#   contents: read   → allows checkout of the repository
#   id-token: write  → allows OIDC federation with Azure (no AZURE_CREDENTIALS needed)
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/e-commerce
  RESOURCE_GROUP: e-commerce-rg
  ACA_ENV: e-commerce-env
  LOCATION: eastasia

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#
#   AZURE_CLIENT_ID      — Managed Identity client ID (OIDC login)
#   AZURE_TENANT_ID      — Azure tenant ID
#   AZURE_SUBSCRIPTION_ID— Azure subscription ID
#   CR_PAT               — GitHub Personal Access Token with write:packages scope
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Job 1: Detect which service directories changed ─────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      client:               ${{ steps.filter.outputs.client }}
      user_service:         ${{ steps.filter.outputs.user_service }}
      product_catalog:      ${{ steps.filter.outputs.product_catalog }}
      order_service:        ${{ steps.filter.outputs.order_service }}
      payment_service:      ${{ steps.filter.outputs.payment_service }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      api_gateway:          ${{ steps.filter.outputs.api_gateway }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            user_service:
              - 'user-service/**'
            product_catalog:
              - 'product-catalog-service/**'
            order_service:
              - 'order-service/**'
            payment_service:
              - 'payment-service/**'
            notification_service:
              - 'notification-service/**'
            api_gateway:
              - 'api-gateway/**'

  # ── Job 2: Ensure ACA Environment + RabbitMQ exist ──────────────────────────
  setup-infra:
    name: Ensure ACA Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps Environment (if not exists)
        run: |
          if ! az containerapp env show \
              --name ${{ env.ACA_ENV }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --output none 2>/dev/null; then
            echo "Creating Container Apps Environment..."
            az containerapp env create \
              --name ${{ env.ACA_ENV }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}
          else
            echo "Container Apps Environment already exists, skipping."
          fi

      - name: Create RabbitMQ Container App (if not exists)
        run: |
          if ! az containerapp show \
              --name rabbitmq \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --output none 2>/dev/null; then
            echo "Creating RabbitMQ..."
            az containerapp create \
              --name rabbitmq \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.ACA_ENV }} \
              --image rabbitmq:3-management \
              --target-port 5672 \
              --exposed-port 5672 \
              --ingress internal \
              --transport tcp \
              --min-replicas 1 \
              --max-replicas 1
          else
            echo "RabbitMQ already exists, skipping."
          fi

  # ── client (Next.js) ────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy client
    needs: [detect-changes, setup-infra]
    if: |
      needs.detect-changes.outputs.client == 'true' ||
      github.event.inputs.service == 'client' ||
      github.event.inputs.service == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kaweesha-nethmina
          password: ${{ secrets.CR_PAT }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or Update Container App
        run: |
          if az containerapp show --name client --resource-group ${{ env.RESOURCE_GROUP }} --output none 2>/dev/null; then
            echo "Updating existing client app..."
            az containerapp registry set \
              --name client \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ghcr.io \
              --username kaweesha-nethmina \
              --password ${{ secrets.CR_PAT }}
            az containerapp update \
              --name client \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_PREFIX }}/client:latest \
              --set-env-vars \
                API_GATEWAY_URL="http://api-gateway"
          else
            echo "Creating client app..."
            az containerapp create \
              --name client \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.ACA_ENV }} \
              --image ${{ env.IMAGE_PREFIX }}/client:latest \
              --registry-server ghcr.io \
              --registry-username kaweesha-nethmina \
              --registry-password ${{ secrets.CR_PAT }} \
              --target-port 3000 \
              --ingress external \
              --min-replicas 1 \
              --env-vars \
                API_GATEWAY_URL="http://api-gateway"
          fi

  # ── user-service (Node.js) ───────────────────────────────────────────────────
  deploy-user-service:
