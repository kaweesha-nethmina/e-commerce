              --ingress internal \
              --min-replicas 1 \
              --env-vars \
                MONGO_URI="mongodb+srv://kaweesha:17420@myatlasclusteredu.dubkafb.mongodb.net/" \
                PORT="3001" \
                JWT_SECRET="your-jwt-secret" \
                RABBITMQ_URL="amqp://guest:guest@rabbitmq:5672/"
          fi

  # ── product-catalog-service (Python/FastAPI) ──────────────────────────────────
