# Force redeploy for database connection update
server.port=${SERVER_PORT:3004}
spring.application.name=notification-service

# User Service (integration)
user.service.url=${USER_SERVICE_URL:http://localhost:3001}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# MongoDB — use MONGO_URI directly as the full URI; the database name
# is included in the URI itself (e.g. /ctse_notifications?retryWrites=true)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ctse_notifications}

# Enable verbose logging for RabbitMQ and notification listeners to debug event flow
logging.level.com.ctse.notification=DEBUG
logging.level.org.springframework.amqp=INFO
