openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: Handles user registration, authentication, and profile retrieval for the e-commerce platform.
servers:
  - url: http://localhost:3001
    description: Local development server
paths:
  /health:
    get:
      summary: Service Health Check
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Created successfully
        '400':
          description: Missing parameters
        '409':
          description: Email already registered
  /auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully returns JWT
        '401':
          description: Invalid credentials
  /auth/validate:
    post:
      summary: Validate JWT token
      description: Internal endpoint used by other microservices to verify users.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Invalid or missing token
  /users/{id}:
    get:
      summary: Get user details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns user info (id, name, email)
        '404':
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
