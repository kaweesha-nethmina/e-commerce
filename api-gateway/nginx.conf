events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    upstream user_service         { server user-service; }
    upstream product_service      { server product-catalog-service; }
    upstream order_service        { server order-service; }
    upstream notification_service { server notification-service; }
    upstream payment_service      { server payment-service; }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 502 '{"status":"error","message":"Service temporarily unavailable"}';
        }

        # User Service
        location /users/      { proxy_pass http://user_service/users/; }
        location /auth/       { proxy_pass http://user_service/auth/; }
        location /health/user { proxy_pass http://user_service/health; }

        # Product Service
        location /products/      { proxy_pass http://product_service/products/; }
        location /health/product { proxy_pass http://product_service/health; }

        # Order Service
        location /orders/      { proxy_pass http://order_service/orders/; }
        location /health/order { proxy_pass http://order_service/health; }

        # Notification Service
        location /notifications/      { proxy_pass http://notification_service/notifications/; }
        location /health/notification { proxy_pass http://notification_service/health; }

        # Payment Service
        location /payments/      { proxy_pass http://payment_service/payments/; }
        location /health/payment { proxy_pass http://payment_service/health; }

        # Gateway Health
        location = /health {
            default_type application/json;
            return 200 '{"status":"online","service":"api-gateway"}';
        }
        location = /health/gateway {
            default_type application/json;
            return 200 '{"status":"online","service":"api-gateway"}';
        }
    }
}
