events {
    worker_connections 1024;
}

http {
    # Logging configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream declarations to match docker-compose service names
    upstream user_service {
        server user-service:3001;
    }

    upstream product_service {
        server product-catalog-service:3002;
    }

    upstream order_service {
        server order-service:3003;
    }

    upstream notification_service {
        server notification-service:3004;
    }

    server {
        listen 80;
        server_name localhost;

        # --- User Service ---
        location /users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/user {
            proxy_pass http://user_service/health;
            proxy_set_header Host $host;
        }

        # --- Product Catalog Service ---
        location /products {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
        }

        location /health/product {
            proxy_pass http://product_service/health;
            proxy_set_header Host $host;
        }

        # --- Order Service ---
        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
        }

        location /health/order {
            proxy_pass http://order_service/health;
            proxy_set_header Host $host;
        }

        # --- Notification Service ---
        location /notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
        }

        location /health/notification {
            proxy_pass http://notification_service/health;
            proxy_set_header Host $host;
        }

        # Gateway health check
        location /health/gateway {
            default_type application/json;
            return 200 '{"status": "online", "service": "api-gateway"}';
        }
    }
}
