# SonarCloud (free tier) - DevSecOps SAST
# Create project at https://sonarcloud.io and add SONAR_TOKEN to GitHub secrets
sonar.organization=
sonar.projectKey=

# Monorepo: all microservices
sonar.sources=user-service/src,product-catalog-service,order-service,notification-service/src
sonar.exclusions=**/node_modules/,**/dist/,**/target/,**/__pycache__/,**/*.test.ts,**/test_*.py

# Optional: set for your org (e.g. your-github-username)
# sonar.organization=your-github-username
# sonar.projectKey=your-github-username_ctse-assignment
